environments:
  default:
    values:
    - jx-values.yaml
repositories:
- name: jx3
  url: https://jenkins-x-charts.github.io/repo
- name: gh
  url: https://chartmuseum-jx3.develop.jaraxa.systems  
releases:
- chart: gh/netcomp
  version: 0.0.0-DEVELOP-1730989481491
  name: netcomp
  namespace: '{{ requiredEnv "PREVIEW_NAMESPACE" }}'
  values:
  - jx-values.yaml
  - 06_netcomp-values.yaml.gotmpl
- chart: gh/dkv-pet-proxy
  version: 0.0.0-DEVELOP-1730989222713
  name: dkv-pet-proxy
  namespace: '{{ requiredEnv "PREVIEW_NAMESPACE" }}'
  values:
  - jx-values.yaml
  - 09_pet-proxy-values.yaml.gotmpl
- chart: gh/dkv-client
  version: 0.0.0-DEVELOP-1730297188271
  name: dkv-client
  namespace: '{{ requiredEnv "PREVIEW_NAMESPACE" }}'
  values:
  - 05_dkv-client-values.yaml.gotmpl
  - jx-values.yaml  
- chart: jx3/jx-verify
  name: jx-verify
  namespace: '{{ requiredEnv "PREVIEW_NAMESPACE" }}'
- chart: '../charts/{{ requiredEnv "APP_NAME" }}'
  name: preview
  wait: true
  createNamespace: true
  namespace: '{{ requiredEnv "PREVIEW_NAMESPACE" }}'
  values:
  - jx-values.yaml
  - values.yaml.gotmpl
  hooks:
  - events: ["presync"]
    showlogs: true
    command: "jx"
    args:
    - secret
    - copy
    - --create-namespace
    - --selector
    - "secret.jenkins-x.io/replica-source=true"
    - --to
    - '{{ requiredEnv "PREVIEW_NAMESPACE" }}'
  - events: ["presync"]
    showlogs: true
    command: "jx"
    args:
    - secret
    - copy
    - -n
    - jx-dkv-develop
    - --name
    - tls-develop-jaraxa-systems-p
    - --to
    - '{{ requiredEnv "PREVIEW_NAMESPACE" }}'    
